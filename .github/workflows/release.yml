name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: node --test
      - run: node scripts/build.mjs
      - name: Create GitHub Release with zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/unsnitch-chrome.zip dist/unsnitch-firefox.zip shortcut/Unsnitch.shortcut userscript/unsnitch.user.js --title "Unsnitch $GITHUB_REF_NAME" --generate-notes
